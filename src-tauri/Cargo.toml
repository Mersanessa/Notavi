[package]
name = "notavi"
version = "1.3.0"
description = "A private, local-first novel library and reader"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "notavi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2"

# Read aloud on Android: the system WebView has no speech synthesis, so use the platform TextToSpeech engine.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-tts = "0.2.1"

# Debug builds (the unsigned Android APK) don't need Rust debug symbols; they made the APK ~250 MB.
[profile.dev]
debug = false
strip = "debuginfo"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
